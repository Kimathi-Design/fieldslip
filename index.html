<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE4" />
    <meta name="description" content="Fieldslip is a set of offline tools kept on your phone." />
    <title>Fieldslip</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <main class="column">
      <div class="lockup">
        <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="7" y="4.5" width="18" height="23" rx="2.5" fill="none" stroke="#1C1915" stroke-width="1.75" />
          <line x1="12" y1="4.5" x2="12" y2="27.5" stroke="#1C1915" stroke-width="1.75" />
          <line x1="16" y1="12" x2="21.5" y2="12" stroke="#1C1915" stroke-width="1.75" stroke-linecap="round" />
          <line x1="16" y1="16.5" x2="21.5" y2="16.5" stroke="#1C1915" stroke-width="1.75" stroke-linecap="round" />
        </svg>
        <div>
          <h1 class="word">Fieldslip</h1>
          <p class="promise">Kept on this phone.</p>
        </div>
      </div>
      <a class="card" href="/privacy">
        <div class="card-head">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="#1C1915" stroke-width="1.75" stroke-linejoin="round" />
            <path d="M4.5 7.5 12 12.5l7.5-5" fill="none" stroke="#1C1915" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <h2>Privacy</h2>
        </div>
        <p>How calculations stay on the phone, and what ads may receive.</p>
      </a>
    </main>
  </body>
</html>
